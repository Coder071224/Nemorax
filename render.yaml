services:
  - type: web
    name: nemorax-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn nemorax.backend.main:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NEMORAX_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-20b

  - type: web
    name: nemorax-flet-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python serve_web.py
    envVars:
      - key: NEMORAX_ENV
        value: production
      - key: NEMORAX_API_URL
        sync: false
      - key: NEMORAX_API_FALLBACK_URLS
        sync: false
