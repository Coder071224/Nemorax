[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemorax"
version = "1.0.0"
description = "Nemis desktop/web/mobile-ready AI assistant app by Nemorax"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "flet==0.84.0",
  "httpx==0.28.1",
  "tzdata==2026.1",
]

[project.optional-dependencies]
backend = [
  "fastapi==0.135.3",
  "uvicorn[standard]==0.44.0",
  "pydantic==2.13.0",
  "beautifulsoup4==4.14.3",
  "lxml==6.0.4",
  "trafilatura==2.0.0",
  "rapidfuzz==3.14.5",
  "pypdf==6.10.0",
  "dateparser==1.4.0",
  "htmldate==1.9.4",
  "pytest==8.4.2",
]
web = [
  "flet-web==0.84.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.flet]
org = "com.nemorax"
product = "Nemis"
company = "Nemorax"
copyright = "Copyright (c) 2026 Nemorax"

[tool.flet.app]
path = "."
module = "app.py"
assets = "assets"

[tool.flet.android]
adaptive_icon_background = "#0D0820"
permissions = ["android.permission.INTERNET"]
dependencies = [
  "flet==0.84.0",
  "httpx==0.28.1",
  "tzdata==2026.1",
]

[tool.flet.android.app]
exclude = [
  ".agents",
  ".claude",
  ".git",
  ".github",
  ".idea",
  ".junie",
